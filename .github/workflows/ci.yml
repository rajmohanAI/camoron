name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :domain:test --stacktrace

      - name: Assemble debug and fast APKs
        run: ./gradlew assembleDebug assembleFast --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - uses: actions/upload-artifact@v4
        with:
          name: camoron-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: camoron-apk
          path: app/build/outputs/apk/fast/*.apk

      # Every build of main replaces the "latest-dev" pre-release, so these links always serve the newest APKs:
      # https://github.com/rajmohanAI/camoron/releases/download/latest-dev/camoron.apk (fast, for trying out)
      # https://github.com/rajmohanAI/camoron/releases/download/latest-dev/camoron-debug.apk
      - name: Publish APK to the latest-dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk camoron-debug.apk
          cp app/build/outputs/apk/fast/app-fast.apk camoron.apk
          notes="Builds of ${GITHUB_SHA::7} from main. camoron.apk is optimised for trying on a phone; camoron-debug.apk is for debugging."
          # Move the tag instead of deleting it: deleting a release's tag and recreating it straight
          # away can leave the new release as an untagged draft, whose download link is a 404.
          git tag -f latest-dev "$GITHUB_SHA"
          git push -f origin refs/tags/latest-dev
          # Remove drafts a failed publish left behind.
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .name == "Camoron latest dev build") | .id' |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"
          if gh release view latest-dev > /dev/null 2>&1; then
            gh release upload latest-dev camoron.apk camoron-debug.apk --clobber
            gh release edit latest-dev --draft=false --prerelease --title "Camoron latest dev build" --notes "$notes"
          else
            gh release create latest-dev camoron.apk camoron-debug.apk --verify-tag --prerelease \
              --title "Camoron latest dev build" --notes "$notes"
          fi
          # Fail the build if the link people use doesn't serve the APK.
          gh release view latest-dev --json isDraft,assets \
            --jq 'if .isDraft or (.assets | map(.name) | (index("camoron-debug.apk") and index("camoron.apk")) | not) then error("latest-dev is not published") else "latest-dev published" end'
