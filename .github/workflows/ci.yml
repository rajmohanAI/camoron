name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :domain:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - uses: actions/upload-artifact@v4
        with:
          name: camoron-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Every build of main replaces the "latest-dev" pre-release, so this link always serves the newest APK:
      # https://github.com/rajmohanAI/camoron/releases/download/latest-dev/camoron-debug.apk
      - name: Publish APK to the latest-dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk camoron-debug.apk
          gh release delete latest-dev --yes --cleanup-tag || true
          gh release create latest-dev camoron-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Camoron latest dev build" \
            --notes "Debug build of ${GITHUB_SHA::7} from main, for testing on Android devices."
